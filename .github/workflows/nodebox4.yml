name: NodeBox 4

on:
  push:
    branches: [nodebox4]
  pull_request:
    branches: [nodebox4]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Includes the golden masters against NodeBox 3 (nodebox3_examples.rs,
      # nodebox3_random.rs). nodebox-python needs Python headers and is not used.
      - name: Run tests
        run: cargo test --workspace --exclude nodebox-python

  wasm:
    name: WASM module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # The same release build the app ships. Warnings fail the build here, for
      # the crates that go into the app.
      - name: Build WASM module
        run: wasm-pack build nodebox-electron --target web --out-dir "${{ github.workspace }}/electron-app/wasm"
        working-directory: crates
        env:
          RUSTFLAGS: -D warnings

      - name: Report size
        run: |
          wasm=electron-app/wasm/nodebox_electron_bg.wasm
          raw=$(stat -c %s "$wasm")
          gz=$(gzip -9 -c "$wasm" | wc -c)
          echo "nodebox_electron_bg.wasm: $((raw / 1024)) KB, $((gz / 1024)) KB gzipped" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: electron-app/wasm
          if-no-files-found: error

  electron:
    name: Electron app
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: electron-app

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: electron-app/wasm

      - name: Type-check and build
        run: npm run build
        working-directory: electron-app

      # Includes Python's random module on MicroPython against Jython's output.
      - name: Unit tests
        run: npm test
        working-directory: electron-app

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Chromium's
      # sandbox uses.
      - name: Install Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The runner has no GPU, so the viewer's WebGPU runs on SwiftShader.
      - name: E2E tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
        working-directory: electron-app
        env:
          NODEBOX_SOFTWARE_GPU: '1'

      - name: Upload E2E results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: electron-app/test-results
