[package]
name = "nodebox-electron"
description = "WASM bindings for the NodeBox Electron app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nodebox-core = { path = "../nodebox-core", default-features = false, features = ["serde"] }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# The viewer draws with Vello through the page's WebGPU, so it exists on wasm32 only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
nodebox-vello = { path = "../nodebox-vello" }
vello = { workspace = true }
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
