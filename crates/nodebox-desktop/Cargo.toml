[package]
name = "nodebox-desktop"
description = "Native desktop GUI for NodeBox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "nodebox_desktop"
path = "src/lib.rs"

[dependencies]
nodebox-core = { path = "../nodebox-core" }
nodebox-eval = { path = "../nodebox-eval" }

# GUI
eframe = "0.33"
egui = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
egui-wgpu = { version = "0.33", optional = true }

# Recent files persistence
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Image export
image = { version = "0.25", features = ["png"] }
tiny-skia = "0.11"

# Async runtime for cancellable rendering
smol = "2"

# Native menu bar (macOS)
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"

# DesktopPlatform dependencies (desktop only)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.arboard]
version = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ureq]
version = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.font-kit]
workspace = true

[features]
default = ["gpu-rendering"]
gpu-rendering = ["dep:vello", "dep:egui-wgpu", "dep:pollster", "eframe/wgpu"]

[dependencies.vello]
workspace = true
optional = true

[dependencies.pollster]
workspace = true
optional = true

[dev-dependencies]
egui_kittest = "0.33"
tempfile = "3"
