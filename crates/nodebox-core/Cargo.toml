[package]
name = "nodebox-core"
description = "Core types, operations, and platform abstraction for NodeBox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["system-fonts", "parallel"]
system-fonts = ["dep:font-kit", "dep:pathfinder_geometry"]
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dependencies]
uuid = { workspace = true }
font-kit = { workspace = true, optional = true }
pathfinder_geometry = { workspace = true, optional = true }

# From nodebox-ops
rayon = { version = "1.10", optional = true }
usvg = "0.42"
csv = "1"

# For WASM-compatible text-to-path
ttf-parser = "0.24"

# For boolean path operations (compound node)
i_overlay = "1"

# From nodebox-ndbx
quick-xml = { workspace = true }

# From nodebox-ndbx + nodebox-port
thiserror = { workspace = true }

# From nodebox-port
log = "0.4"

# Optional serde support
serde = { version = "1", features = ["derive"], optional = true }

[[bench]]
name = "clone_library"
harness = false

[dev-dependencies]
proptest = { workspace = true }
approx = { workspace = true }
tempfile = "3"
