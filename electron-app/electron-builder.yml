appId: be.emrg.nodebox
productName: NodeBox

directories:
  output: release

# Vite bundles the renderer, including the wasm module, into dist/. Nothing
# from node_modules is needed at runtime, which is why every npm package is a
# devDependency: electron-builder copies dependencies into the app.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true

# Chromium's UI strings (context menus, built-in dialogs) for each language
# take about 40 MB. NodeBox's own UI is English only.
electronLanguages:
  - en
  - en-US

# Smaller installers, slower packaging.
compression: maximum

fileAssociations:
  - ext: ndbx
    name: NodeBox Document
    role: Editor

mac:
  category: public.app-category.graphics-design
  icon: ../platform/mac/res/Resources/nodebox.icns
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: ../platform/mac/NodeBox.entitlements
  entitlementsInherit: ../platform/mac/NodeBox.entitlements
  # Notarization is enabled via APPLE_APP_SPECIFIC_PASSWORD, APPLE_ID, and
  # APPLE_TEAM_ID env vars. When they are absent, electron-builder skips it.

dmg:
  sign: false

win:
  icon: ../platform/windows/installer/nodebox.ico
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: ../platform/mac/res/Resources/nodebox.icns
  category: Graphics
  target:
    - AppImage
    - deb
  mimeTypes:
    - application/x-nodebox
