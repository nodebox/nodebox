[package]
name = "nodebox-core"
description = "Core types, operations, and platform abstraction for NodeBox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dependencies]
uuid = { workspace = true }

# Font lookup and glyph outlines; both are already in the tree through usvg.
fontdb = "0.18"
ttf-parser = "0.21"

# From nodebox-ops
rayon = { version = "1.10", optional = true }
usvg = "0.42"
csv = "1"

# From nodebox-ndbx
quick-xml = { workspace = true }

# From nodebox-ndbx + nodebox-port
thiserror = { workspace = true }

# From nodebox-port
log = "0.4"

# Optional serde support
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[[bench]]
name = "clone_library"
harness = false

[dev-dependencies]
proptest = { workspace = true }
approx = { workspace = true }
tempfile = "3"
